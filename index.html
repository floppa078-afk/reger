<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6750a4">
  <title>Estonia Best Ping</title>
  <style>
    :source { --bg: #fffbfe; --surface: #f3edf7; --surface-high: #ece6ee; --primary: #6750a4; --on-primary: #fff; --text: #1d1b20; --muted: #49454f; --outline: #79747e; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 12%, rgba(103,80,164,.18), transparent 28rem),
        radial-gradient(circle at 88% 88%, rgba(3,0,56,.12), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid rgba(121,116,126,.18);
      border-radius: 32px;
      background: rgba(243,237,247,.88);
      box-shadow: 0 12px 32px rgba(29,27,32,.12);
      backdrop-filter: blur(12px);
    }
    .icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 34px;
      box-shadow: 0 6px 16px rgba(103,80,164,.28);
    }
    h1 { margin: 24px 0 10px; font-size: clamp(32px, 7vw, 52px); line-height: 1.05; letter-spacing: -1.5px; }
    p { max-width: 520px; margin: 0; color: var(--muted); font-size: 18px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(29,27,32,.14); }
    .filled { background: var(--primary); color: var(--on-primary); }
    .tonal { background: #e8def8; color: #1d192b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1b20; --surface: #2b2930; --primary: #d0bcff; --on-primary: #381e72; --text: #e6e1e5; --muted: #cac4d0; }
      body { background: radial-gradient(circle at 12% 12%, rgba(208,188,255,.12), transparent 28rem), radial-gradient(circle at 88% 88%, rgba(103,80,164,.2), transparent 24rem), var(--bg); }
      .card { background: rgba(43,41,48,.92); border-color: rgba(202,196,208,.15); }
      .tonal { background: #4a4458; color: #e8def8; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🌐</div>
    <h1>Estonia Best Ping</h1>
    <p>Расширение для голосовых звонков Vendetta, которое выбирает сервер Rotterdam для наименьшей задержки из Эстонии.</p>
    <div class="actions">
      <a class="button filled" href="https://discord.gg/kastazdess" target="_blank" rel="noopener noreferrer">Discord-сообщество</a>
      <a class="button tonal" href="https://github.com/floppa078-afk/reger" target="_blank" rel="noopener noreferrer">GitHub репозиторий</a>
    </div>
  </main>
</body>
</html>
